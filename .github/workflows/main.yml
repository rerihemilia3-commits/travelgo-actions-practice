name: TravelGo Quality Check

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

jobs:
  check-project:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          echo "Checking project files..."
          test -f index.html
          test -f style.css
          test -f script.js

      - name: Verify website content
        run: |
          grep -q "TravelGo" index.html
          grep -q "travelButton" index.html
          echo "Website content verified!"

      - name: Verify CSS and JavaScript
        run: |
          grep -q "style.css" index.html
          grep -q "script.js" index.html

      - name: Complete workflow
        run: echo "TravelGo project passed all checks!"
